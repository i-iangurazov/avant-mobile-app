name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_DB: remediation
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [55448:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://audit@127.0.0.1:55448/remediation
      DATABASE_URL: postgresql://audit@127.0.0.1:55448/remediation
      EXPO_NO_DOTENV: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:remediation
      - run: npm run check:orders
      - run: npm run check:loyalty
      - run: npm audit --omit=dev --audit-level=high
